<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte des membres</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1rem;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .header h1 { font-size: 1.1rem; font-weight: 700; color: #1a1a1a; }
    .badge {
      background: #e0e7ff; color: #3730a3;
      padding: 0.2rem 0.6rem; border-radius: 999px;
      font-size: 0.8rem; font-weight: 600; margin-left: 0.5rem;
    }
    a.btn-back {
      padding: 0.45rem 0.9rem; border-radius: 7px;
      font-size: 0.85rem; font-weight: 600;
      text-decoration: none; background: #e5e7eb; color: #374151;
    }
    #map { flex: 1; min-height: 0; }
  </style>
</head>
<body>
  <div class="header">
    <div style="display:flex;align-items:center;">
      <h1>Carte des membres</h1>
      <span class="badge" id="count">…</span>
    </div>
    <a href="/admin" class="btn-back">← Retour</a>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([46.5, 2.5], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    fetch('/admin/map-data')
      .then(r => r.json())
      .then(members => {
        document.getElementById('count').textContent = members.length;
        members.forEach(m => {
          L.circleMarker([m.lat, m.lng], {
            radius: 7,
            fillColor: '#2563eb',
            color: '#1d4ed8',
            weight: 1.5,
            fillOpacity: 0.8,
          }).bindPopup(`<strong>${m.name}</strong><br>${m.ville}`).addTo(map);
        });
      });
  </script>
</body>
</html>
