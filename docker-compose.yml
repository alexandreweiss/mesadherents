services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:5000"
    volumes:
      - ./data:/data
    env_file:
      - .env

  mcp:
    build: ./mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - FLASK_API_URL=http://web:5000/api
      - API_KEY=${API_KEY}
    depends_on:
      - web
