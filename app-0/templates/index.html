<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adhésion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.10);
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 420px;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: #1a1a1a;
    }
    .subtitle {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #444;
      margin-bottom: 0.3rem;
      margin-top: 1rem;
    }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      color: #1a1a1a;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
    }
    .error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: #dc2626;
      font-size: 0.9rem;
      margin-top: 1rem;
    }
    button {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.85rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:active { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Devenir membre</h1>
    <p class="subtitle">Remplissez le formulaire pour vous inscrire.</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" autocomplete="on">
      <label for="first_name">Prénom</label>
      <input type="text" id="first_name" name="first_name"
             placeholder="Marie" required autocomplete="given-name">

      <label for="last_name">Nom</label>
      <input type="text" id="last_name" name="last_name"
             placeholder="Dupont" required autocomplete="family-name">

      <label for="email">Adresse email</label>
      <input type="email" id="email" name="email"
             placeholder="marie@exemple.fr" required autocomplete="email">

      <label for="phone">Téléphone</label>
      <input type="tel" id="phone" name="phone"
             placeholder="06 12 34 56 78" required autocomplete="tel">

      <button type="submit">S'inscrire</button>
    </form>
  </div>
</body>
</html>
