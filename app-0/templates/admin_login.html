<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Connexion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.10);
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 360px;
    }
    h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 1.25rem; color: #1a1a1a; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #444; margin-bottom: 0.3rem; }
    input {
      width: 100%; padding: 0.75rem 1rem; border: 1.5px solid #ddd;
      border-radius: 8px; font-size: 1rem; -webkit-appearance: none;
    }
    input:focus { outline: none; border-color: #2563eb; }
    .error {
      background: #fef2f2; border: 1px solid #fca5a5;
      border-radius: 8px; padding: 0.75rem 1rem;
      color: #dc2626; font-size: 0.9rem; margin-top: 0.75rem;
    }
    button {
      width: 100%; margin-top: 1.25rem; padding: 0.85rem;
      background: #1a1a1a; color: #fff; border: none;
      border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Administration</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" required autofocus>
      <button type="submit">Connexion</button>
    </form>
  </div>
</body>
</html>
